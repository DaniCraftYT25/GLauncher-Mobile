<!-- ════════════════════════════════════════════
     VIEW: GMUSIC
     ════════════════════════════════════════════ -->
<div class="view" id="view-gmusic">
    <div class="section-header">
        <h2><i class="fas fa-music"></i> GMusic Player</h2>
        <span class="section-subtitle">Reproductor de música de fondo sin video</span>
    </div>

    <div class="mods-search-bar" style="margin-bottom: 14px; display: flex; gap: 8px; align-items: center;">
        <div style="position: relative; flex: 1; display: flex; align-items: center;">
            <i class="fas fa-search" style="position: absolute; left: 12px; color: var(--primary); font-size: 0.8rem;"></i>
            <input type="text" id="gmusic-search-input" placeholder="Buscar canción o artista en YouTube..." style="padding-left: 34px;">
        </div>
        <button class="btn btn-primary" id="gmusic-search-btn" style="padding: 10px 20px; font-size: 0.7rem; display: flex; align-items: center; gap: 6px; background: var(--primary-gradient); border: 1px solid var(--primary-glow); box-shadow: var(--shadow-glow); border-radius: var(--radius-sm); font-family: 'MinecraftTen'; letter-spacing: 0.5px; cursor: pointer; transition: all var(--transition-fast);">
            <i class="fas fa-search"></i> BUSCAR
        </button>
    </div>

    <div style="display: flex; gap: 16px; align-items: flex-start; height: calc(100% - 70px);">
        <!-- Izquierda: Resultados de Búsqueda y Playlists -->
        <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; max-height: 380px;">
            <!-- Categoría de Playlists Rápidas -->
            <div class="widget-card" style="padding: 10px 14px;">
                <h3><i class="fas fa-list-ul"></i> Playlists Recomendadas</h3>
                <div style="display: flex; gap: 8px; overflow-x: auto; padding-top: 6px;" id="gmusic-playlists-container">
                    <button class="gmusic-playlist-chip active" data-query="Minecraft OST C418">
                        <i class="fas fa-compact-disc"></i> Minecraft OST
                    </button>
                    <button class="gmusic-playlist-chip" data-query="Minecraft Pigstep Remix">
                        <i class="fas fa-fire"></i> Pigstep & Remixes
                    </button>
                    <button class="gmusic-playlist-chip" data-query="Lofi Minecraft Chill">
                        <i class="fas fa-coffee"></i> Lofi Chill
                    </button>
                    <button class="gmusic-playlist-chip" data-query="Minecraft Synthwave">
                        <i class="fas fa-bolt"></i> Synthwave
                    </button>
                </div>
            </div>

            <!-- Resultados -->
            <div style="flex: 1; overflow-y: auto;" id="gmusic-results-container">
                <div class="empty-state">
                    <i class="fas fa-music" style="font-size: 2rem; color: var(--primary);"></i>
                    <h3>GMusic Player</h3>
                    <p>Busca tu música favorita o elige una playlist arriba.</p>
                </div>
            </div>
        </div>

        <!-- Derecha: Interfaz de Audio (Sin Video) -->
        <div style="width: 280px; flex-shrink: 0;" class="widget-card">
            <h3><i class="fas fa-compact-disc"></i> En Reproducción</h3>
            
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px 0;">
                <div id="gmusic-disc-cover" style="width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, #222 20%, #111 60%, var(--primary) 100%); border: 3px solid var(--primary-glow); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px var(--primary-glow); transition: transform 0.5s ease; position: relative;">
                    <div style="width: 35px; height: 35px; border-radius: 50%; background: #000; border: 2px solid var(--glass-border); display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-music" id="gmusic-disc-icon" style="font-size: 0.8rem; color: var(--primary);"></i>
                    </div>
                </div>

                <div style="text-align: center; margin-top: 15px; width: 100%;">
                    <h4 id="gmusic-playing-title" style="font-family: 'MinecraftTen'; font-size: 0.8rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px;">Selecciona una canción</h4>
                    <span id="gmusic-playing-channel" style="font-family: 'Minecraftia'; font-size: 0.6rem; color: var(--text-muted); display: block;">GMusic Player</span>
                </div>

                <div style="display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 15px; width: 100%;">
                    <button class="top-bar-btn" id="gmusic-btn-rewind" title="Retroceder 15s" style="width: 40px; height: 40px; border-radius: 50%; font-size: 0.75rem;">-15s</button>
                    <button class="top-bar-btn" id="gmusic-btn-play" title="Reproducir / Pausar" style="width: 48px; height: 48px; border-radius: 50%; background: var(--primary-gradient); color: white; box-shadow: var(--shadow-glow); font-size: 1rem;"><i class="fas fa-play" id="gmusic-play-icon"></i></button>
                    <button class="top-bar-btn" id="gmusic-btn-forward" title="Adelantar 15s" style="width: 40px; height: 40px; border-radius: 50%; font-size: 0.75rem;">+15s</button>
                </div>
            </div>
        </div>
    </div>
</div>
